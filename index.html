<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Linux Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal {
            width: 100%;
            max-width: 900px;
            height: 500px;
            background-color: #0c0c0c;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }

        .terminal-header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }

        .title {
            color: #888;
            font-size: 14px;
            margin-left: auto;
            margin-right: auto;
        }

        .terminal-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
        }

        .output-line {
            margin-bottom: 5px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #00bfff;
            margin-right: 8px;
            white-space: nowrap;
        }

        .cmd-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
        }

        .error { color: #ff5555; }
        .system { color: #aaa; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="terminal-header">
        <div class="buttons">
            <span class="btn close"></span>
            <span class="btn minimize"></span>
            <span class="btn maximize"></span>
        </div>
        <div class="title">user@web-linux: ~</div>
    </div>
    
    <div class="terminal-body" id="terminal-body">
        <div class="output-line system">欢迎使用 Web Linux 模拟终端！输入 'help' 获取可用的命令列表。</div>
        <div class="input-line">
            <span class="prompt">user@linux:~$</span>
            <input type="text" class="cmd-input" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
    const terminalBody = document.getElementById('terminal-body');
    const cmdInput = document.getElementById('cmd-input');
    const inputLine = document.querySelector('.input-line');

    // 虚拟文件系统与状态
    let currentPath = '~';
    const virtualFS = {
        '~': ['documents', 'downloads', 'readme.txt'],
        '~/documents': ['notes.txt', 'project.js'],
        '~/downloads': ['image.png']
    };

    // 命令集定义
    const commands = {
        'help': () => '可用命令:\n  ls       - 列出当前目录中的文件\n  cd <dir> - 切换目录 (支持 cd .. 或 cd <folder>)\n  pwd      - 显示当前工作目录\n  clear    - 清屏\n  echo     - 输出指定文本\n  whoami   - 显示当前用户\n  date     - 显示系统时间',
        'pwd': () => `/home/user${currentPath === '~' ? '' : currentPath.replace('~', '')}`,
        'whoami': () => 'user',
        'date': () => new Date().toString(),
        'ls': () => {
            const files = virtualFS[currentPath] || [];
            return files.length > 0 ? files.join('  ') : '目录为空';
        }
    };

    // 监听回车键输入
    cmdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const fullCommand = this.value.trim();
            const args = fullCommand.split(' ');
            const cmd = args[0].toLowerCase();
            const param = args[1];

            // 1. 打印用户刚刚输入的命令
            printOutput(`user@linux:${currentPath}$ ${fullCommand}`, 'prompt-copy');

            // 2. 解析并执行命令
            if (fullCommand !== '') {
                executeCommand(cmd, param, fullCommand);
            }

            // 3. 清空输入框并将输入行移至底部
            this.value = '';
            terminalBody.appendChild(inputLine);
            cmdInput.focus();
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
    });

    function executeCommand(cmd, param, fullCommand) {
        if (cmd === 'clear') {
            // 清屏操作
            const lines = terminalBody.querySelectorAll('.output-line');
            lines.forEach(line => line.remove());
            return;
        }

        if (cmd === 'echo') {
            printOutput(fullCommand.substring(5));
            return;
        }

        if (cmd === 'cd') {
            handleCd(param);
            return;
        }

        if (commands[cmd]) {
            printOutput(commands[cmd]());
        } else {
            printOutput(`bash: command not found: ${cmd}`, 'error');
        }
    }

    function handleCd(param) {
        if (!param || param === '~') {
            currentPath = '~';
        } else if (param === '..') {
            if (currentPath !== '~') {
                const parts = currentPath.split('/');
                parts.pop();
                currentPath = parts.join('/') || '~';
            }
        } else {
            const targetPath = currentPath === '~' ? `~/${param}` : `${currentPath}/${param}`;
            if (virtualFS[targetPath]) {
                currentPath = targetPath;
            } else {
                printOutput(`bash: cd: ${param}: No such file or directory`, 'error');
            }
        }
        document.querySelector('.title').innerText = `user@web-linux: ${currentPath}`;
        document.querySelector('.prompt').innerText = `user@linux:${currentPath}$`;
    }

    function printOutput(text, className = '') {
        const div = document.createElement('div');
        div.className = `output-line ${className}`;
        div.textContent = text;
        terminalBody.insertBefore(div, inputLine);
    }

    // 点击终端任意区域自动聚焦输入框
    document.querySelector('.terminal').addEventListener('click', () => {
        cmdInput.focus();
    });
</script>

</body>
</html>
